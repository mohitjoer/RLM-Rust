[package]
name = "rlm"
version = "0.1.0"
edition = "2021"
authors = ["Mohit <https://github.com/mohit>"]
description = "A high-performance Rust engine for Recursive Language Models (RLM) enabling infinite context processing."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mohit/RLM-Rust"
keywords = ["llm", "ai", "rlm", "agent", "recursive-language-models"]
categories = ["command-line-utilities", "asynchronous", "api-bindings"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for LLM APIs
reqwest = { version = "0.12", features = ["json"] }

# Regex for parsing code blocks
regex = "1"

# Error handling
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Environment variables
dotenvy = "0.15"

# Terminal output (verbose mode)
indicatif = "0.17"
console = "0.15"

# For futures utilities
futures = "0.3"
